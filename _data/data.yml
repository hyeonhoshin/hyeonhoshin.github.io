  - date: "2023.05"
    text: Presented Mosaic at ACM/IEEE IPSN 2023 (CPS-IoT Week, San Antonio, TX).
  - date: "2022.03"
    text: Started the Ph.D. program at KAIST.

# Publications, newest first.
#   badge       required. Short venue label, e.g. "IPSN 2023" (plain text)
#   title       required. Plain text
#   authors     required. Comma-separated; wrap the owner in **…**; a * right after a name marks
#               equal contribution (so the owner with equal contribution is "**Hyeonho Shin***").
#               Any * in the list adds the "* Equal contribution." note automatically.
#   venue       required. Journal or proceedings name (shown in italics)
#   venue_type  journal | proceedings   (JSON-LD only)
#   details     optional. Volume, pages, acceptance rate ... (shown after the venue)
#   year        required. Publication year (JSON-LD datePublished)
#   award       optional; shown with a star. **…** marks the award name
#   doi         optional. Bare DOI such as 10.1145/3715697 (the link https://doi.org/… is built for you)
#   pdf, video  optional full URLs
publications:
  - badge: TOSN 2026
    title: Extremely Low-resolution RFID Vision for Real-time and Visually-anonymized Action Recognition
    authors: "**Hyeonho Shin***, Seungwoo Shim*, Myeongkyun Cho, Youngki Lee, Jinwoo Shin, Song Min Kim"
    venue: ACM Transactions on Sensor Networks (TOSN)
    venue_type: journal
    details: Vol. 22, No. 3, <span class="nw">pp. 1–26</span>, 2026 (Fast Track).
    year: 2026
    award: ""
    doi: 10.1145/3715697
    pdf: https://www.dropbox.com/scl/fi/w5385ezfozfexvyce9kk5/TOSN_Mosaic_Extended.pdf?rlkey=g47r0njkr2rx9nl64xatmvwve&dl=1
    video: ""
  - badge: IPSN 2023
    title: "Mosaic: Extremely Low-resolution RFID Vision for Visually-anonymized Action Recognition"
    authors: "Seungwoo Shim*, **Hyeonho Shin***, Myeongkyun Cho, Youngki Lee, Jinwoo Shin, Song Min Kim"
    venue: Proceedings of ACM/IEEE IPSN 2023
    venue_type: proceedings
    details: <span class="nw">pp. 247–260</span>. Acceptance rate 26.5%.
    year: 2023
    award: "**Outstanding Paper Award**, Institute of Embedded Engineering of Korea (IEMEK), 2023"
    doi: 10.1145/3583120.3586968
    pdf: https://www.dropbox.com/s/vxhvtjx77int8on/3583120.3586968_Mosaic.pdf?dl=1
    video: https://youtu.be/8n0j3n2S1tw     # (IPSN'23) Mosaic Demo | Smile Lab KAIST

# Dated-row sections, in page order. Each entry names a list below (`key`) and its heading
# (`title`, also used in the top menu). To hide a section, delete its entry or empty its list;
# to add one, add a list with the same three keys and an entry here.
# The key becomes the section id: use a plain word such as talks or teaching. Avoid keys that
# contain community, social, comment, related, menu, header, footer, sidebar, sponsor, banner,
# popup, extra or share: reader tools may drop such sections.
row_sections:
  - key: patents
    title: Patents
  - key: service
    title: Service
  - key: education
    title: Education
  - key: honors
    title: Honors

