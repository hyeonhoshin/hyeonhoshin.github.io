# =============================================================================
# Site content. Updating the site = editing this file only.
#
# Writing rules
#   - ALWAYS quote dates: "2024.10" (unquoted, YAML reads 2024.10 as the number 2024.1).
#   - Quote any value that contains ": ", " #", or starts with * & ! [ { > | % @ `.
#   - Inline HTML is allowed in text fields, e.g. <i>Journal</i> or <span lang="ko">한국어</span>.
#     Wrap Korean words in <span lang="ko"> so they get the right font and line breaking,
#     and short runs that must stay on one line (page ranges) in <span class="nw">.
#     Exceptions: `when`, `date`, `badge`, `title`, `year` and every `url`/`doi` are plain
#     text: HTML is not allowed there and characters such as < and & are escaped on output.
#   - **text** becomes bold in: publications[].authors and .award, and every what/sub field.
#   - A link that is empty ("") or missing is simply not shown. Never use "#".
#   - An empty or missing list hides its whole section and its link in the top menu.
#
# Where each key appears (all templates live in _layouts/ and _includes/)
#   profile, bio           -> header and "About"           (_layouts/default.html)
#   news, news_visible     -> "News" (newest first; older items go under "More news")
#   publications           -> "Publications"
#   row_sections           -> which dated-row lists are shown, in which order, under which
#                             heading (patents, service, education, honors)  (_includes/rows.html)
#   earlier                -> collapsed "Earlier" section
#   bio_ko, misc, footer   -> page footer                  (_includes/foot.html)
#   JSON-LD (_includes/jsonld.html) reads profile, bio and publications.
#   /llms.txt reads profile, bio, bio_ko, news (first 4), publications, every row_sections
#   list and misc.
# =============================================================================

# Required: name, title, department, affiliation, lab.name, advisor, email, photo, avatar.
# Optional (leave out or set to "" / [] and the matching text disappears everywhere):
#   name_ko, lab.url, alumni_of, links, keywords.
profile:
  name: Hyeonho Shin
  name_ko: 신현호
  title: Ph.D. Student                        # header line 2 and JSON-LD jobTitle
  department: School of Electrical Engineering
  affiliation: KAIST
  lab:
    name: SMILE Lab
    url: https://smile.kaist.ac.kr
  advisor: Prof. Song Min Kim
  email: hh.shin@kaist.ac.kr
  photo: /assets/images/profile-512.png       # full-size photo (JSON-LD image)
  avatar: /assets/images/avatar               # prefix of avatar-192.webp, avatar-384.webp, avatar-192.png
  alumni_of:                                  # JSON-LD alumniOf only (degrees completed)
    - Hanyang University
    - KAIST
  links:                                      # shown after the e-mail address; also JSON-LD sameAs
    - label: GitHub
      url: https://github.com/hyeonhoshin
    - label: ORCID
      url: https://orcid.org/0009-0003-3352-2008
    - label: Semantic Scholar
      url: https://www.semanticscholar.org/author/2216691312
  keywords:                                   # JSON-LD knowsAbout and /llms.txt (not shown on the page)
    - Battery-free sensing
    - Extremely low-power sensing systems
    - RFID
    - Privacy-preserving sensing
    - On-device AI
    - Embedded systems
    - Internet of Things

# First paragraph of the page. Keep the first sentence: search engines and AI tools quote it.
bio: >-
  I am Hyeonho Shin (<span lang="ko">신현호</span>), a Ph.D. student in the School of Electrical
  Engineering at KAIST, advised by Prof. Song Min Kim in the SMILE Lab.
  I build battery-free and extremely low-power sensing systems that bring always-on,
  privacy-preserving perception to everyday spaces, combining RFID-based sensing with on-device AI.
  My work on extremely low-resolution RFID vision (Mosaic) appeared at ACM/IEEE IPSN 2023 and
  ACM Transactions on Sensor Networks, and is protected by U.S. and Korean patents.

# Korean one-liner: first line of the footer and /llms.txt.
bio_ko: 신현호 — KAIST 전기및전자공학부 박사과정 (<span class="nw">SMILE Lab</span>, 지도교수 김성민)

# News: newest first. Required: date ("YYYY.MM", quoted) and text. Only the first
# `news_visible` items are shown; the rest sit in a collapsed "More news" box.
# news_visible is a plain number (no quotes needed; quoted values are converted).
news_visible: 3
