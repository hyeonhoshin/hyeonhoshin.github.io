  - date: "2026.04"
    text: Our extended Mosaic paper is published in <i>ACM Transactions on Sensor Networks</i> <span class="nw">(Vol. 22, No. 3)</span>.
  - date: "2025.03"
    text: U.S. Patent 12,243,291 granted (low-resolution imaging for action recognition).
  - date: "2024.07"
    text: Korean Patent 10-2688049 registered.
  - date: "2024.05"
    text: Korean Patent 10-2670139 registered.
  - date: "2023.11"
