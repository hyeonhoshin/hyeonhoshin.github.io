# Site settings for Jekyll, jekyll-seo-tag and jekyll-sitemap.
# Page content lives in _data/data.yml; styles in _includes/site.css.

title: Hyeonho Shin (신현호)
tagline: Ph.D. Student, KAIST   # homepage <title> becomes "title | tagline"
description: >-
  Hyeonho Shin (신현호), Ph.D. student in Electrical Engineering at KAIST (SMILE Lab),
  builds battery-free, low-power RFID sensing with privacy-preserving on-device AI.
url: https://hyeonhoshin.github.io
baseurl: ""
lang: en
locale: en_US
timezone: Asia/Seoul   # "Last updated" and dateModified use Korea time on every build machine

# GitHub Pages applies its default theme (jekyll-theme-primer) when no theme is set, which
# would publish an unused /assets/css/style.css. This site has no theme.
theme: null

# jekyll-seo-tag: <meta name="author">. Profile links (sameAs) come from data.yml only,
# through _includes/jsonld.html.
author:
  name: Hyeonho Shin

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      image:                                  # og:image / twitter:image for every page
        path: /assets/images/profile-512.png
        alt: Photo of Hyeonho Shin
      twitter:
        card: summary

exclude:
  - README.md
  - LICENSE.txt
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  # Working notes must never be published (Jekyll turns any root .md file into a page)
  - CLAUDE.md
  - AGENTS.md
  - NOTES.md
  - TODO.md
  - "*.local.md"
